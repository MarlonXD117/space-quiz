<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7ff">
  <title>Órbita — Quiz de exploración espacial</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f5f7ff;
      --surface: #ffffff;
      --surface-soft: #f2f4fc;
      --ink: #171a35;
      --muted: #727792;
      --line: #e7e9f3;
      --accent: #6258e8;
      --accent-strong: #5147d5;
      --accent-soft: #eeedff;
      --success: #16855f;
      --success-bg: #e6f8f0;
      --error: #d94b5c;
      --error-bg: #fff0f1;
      --shadow: 0 24px 70px rgba(39, 42, 91, .11), 0 3px 12px rgba(39, 42, 91, .05);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10111d;
        --surface: #1b1d2c;
        --surface-soft: #242638;
        --ink: #f3f3ff;
        --muted: #a4a7c0;
        --line: #323449;
        --accent: #a49bff;
        --accent-strong: #b3acff;
        --accent-soft: #302d50;
        --success: #65d5a7;
        --success-bg: #1d3b35;
        --error: #ff8290;
        --error-bg: #472b35;
        --shadow: 0 24px 70px rgba(0, 0, 0, .3), 0 3px 12px rgba(0, 0, 0, .18);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 42px 20px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 8% 12%, rgba(131, 119, 255, .13), transparent 34%),
        radial-gradient(ellipse at 92% 88%, rgba(255, 174, 130, .14), transparent 30%),
        var(--page);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.55;
      transition: background-color .2s ease, color .2s ease;
    }

    button { font: inherit; }

    .app { width: min(100%, 540px); }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 16px;
      letter-spacing: 0;
    }

    .card {
      overflow: hidden;
      padding: 32px;
      border: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 13px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .score {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      height: 7px;
      overflow: hidden;
      margin-bottom: 30px;
      border-radius: 999px;
      background: var(--surface-soft);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8276ff, #5b55e8);
      transition: width .45s cubic-bezier(.2, .8, .2, 1);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    h1, h2 {
      margin: 0;
      font-size: clamp(23px, 5vw, 29px);
      line-height: 1.2;
      letter-spacing: -.035em;
    }

    .question { min-height: 70px; margin-bottom: 22px; }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer {
      width: 100%;
      min-height: 54px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 12px 15px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--surface);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, transform .18s ease, box-shadow .18s ease;
    }

    .answer:hover:not(:disabled), .answer:focus-visible {
      border-color: var(--accent);
      background: var(--accent-soft);
      outline: none;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
      transform: translateY(-1px);
    }

    .answer:disabled { cursor: default; }

    .answer.selected {
      position: relative;
      overflow: hidden;
      border-width: 1.5px;
      box-shadow: inset 4px 0 0 currentColor, 0 0 0 1px color-mix(in srgb, currentColor 24%, transparent);
    }

    .answer.selected::after {
      position: absolute;
      top: 50%;
      right: 16px;
      width: 8px;
      height: 8px;
      border-radius: 3px;
      background: currentColor;
      box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 16%, transparent);
      content: "";
      transform: translateY(-50%);
    }

    .answer-letter {
      width: 27px;
      height: 27px;
      flex: 0 0 27px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .answer.correct {
      border-color: color-mix(in srgb, var(--success) 50%, var(--line));
      background: var(--success-bg);
      color: var(--success);
      animation: pop-in .3s ease both;
    }

    .answer.correct .answer-letter {
      background: var(--success);
      color: white;
    }

    .answer.incorrect {
      border-color: color-mix(in srgb, var(--error) 50%, var(--line));
      background: var(--error-bg);
      color: var(--error);
      animation: shake .38s ease both;
    }

    .answer.selected.correct, .answer.selected.incorrect {
      background-image: repeating-linear-gradient(
        0deg,
        transparent 0,
        transparent 8px,
        color-mix(in srgb, currentColor 4%, transparent) 8px,
        color-mix(in srgb, currentColor 4%, transparent) 9px
      );
    }

    .answer.incorrect .answer-letter {
      background: var(--error);
      color: white;
    }

    .feedback {
      min-height: 0;
      margin-top: 14px;
      padding: 0 14px;
      border-radius: 12px;
      font-size: 14px;
      opacity: 0;
      transform: translateY(5px);
      transition: opacity .2s ease, transform .2s ease, padding .2s ease;
    }

    .feedback.visible {
      padding-top: 11px;
      padding-bottom: 11px;
      opacity: 1;
      transform: translateY(0);
      animation: pop-in .25s ease both;
    }

    .feedback.good { background: var(--success-bg); color: var(--success); }
    .feedback.bad { background: var(--error-bg); color: var(--error); }

    .feedback strong { font-weight: 750; }

    .next-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
    }

    .primary {
      min-height: 47px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 18px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: background .18s ease, transform .18s ease, box-shadow .18s ease;
    }

    .primary:hover {
      background: var(--accent-strong);
      box-shadow: 0 7px 18px color-mix(in srgb, var(--accent) 28%, transparent);
      transform: translateY(-1px);
    }

    .primary:focus-visible, .secondary:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 40%, transparent);
      outline-offset: 3px;
    }

    .result { padding: 16px 0 4px; text-align: center; }

    .result-emoji {
      width: 96px;
      height: 96px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--surface-soft);
      font-size: 52px;
      animation: pop-in .55s cubic-bezier(.2, .8, .2, 1) both;
    }

    .result h1 { margin-bottom: 10px; }
    .result-copy { max-width: 370px; margin: 0 auto 22px; color: var(--muted); }
    .result-score { margin: 0 0 24px; font-size: 17px; }
    .result-score strong { color: var(--accent); font-size: 23px; }
    .result .primary { margin: 0 auto; }
    .hidden { display: none !important; }

    .footer-note {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @keyframes pop-in {
      from { opacity: 0; transform: scale(.96) translateY(5px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    @media (max-width: 480px) {
      body { padding: 24px 14px; }
      .card { padding: 24px 20px; border-radius: 20px; }
      .progress-track { margin-bottom: 24px; }
      .question { min-height: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <p class="brand"><span class="brand-mark" aria-hidden="true">✦</span> Órbita <span aria-hidden="true">/</span> Quiz espacial</p>
    <section class="card" aria-labelledby="question-title">
      <div id="quiz-screen">
        <div class="topline">
          <span id="question-count">Pregunta 1 de 10</span>
          <span class="score" aria-label="Puntuación"><span aria-hidden="true">✧</span> <span id="score">0</span> puntos</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Progreso del cuestionario" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <p class="eyebrow">Misión de conocimiento</p>
        <h1 class="question" id="question-title" tabindex="-1"></h1>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
        <div class="next-row">
          <button class="primary hidden" id="next-button" type="button">Siguiente <span aria-hidden="true">→</span></button>
        </div>
      </div>
      <div class="result hidden" id="result-screen" aria-live="polite"></div>
    </section>
    <p class="footer-note" id="footer-note">10 preguntas · Una pequeña aventura por el cosmos</p>
  </main>

  <script>
    const questions = [
      {
        question: "¿Cuál fue el primer satélite artificial que orbitó la Tierra?",
        options: ["Explorer 1", "Sputnik 1", "Vanguard 1", "Luna 1"],
        answer: 1,
        explanation: "La Unión Soviética lanzó Sputnik 1 en 1957; su señal de radio marcó el inicio de la era espacial."
      },
      {
        question: "¿Qué planeta visitó primero una nave espacial terrestre?",
        options: ["Marte", "Venus", "Júpiter", "Mercurio"],
        answer: 1,
        explanation: "La sonda soviética Venera 1 pasó cerca de Venus en 1961, el primer encuentro de una nave con otro planeta."
      },
      {
        question: "¿Cómo se llamó el módulo lunar del Apolo 11?",
        options: ["Columbia", "Eagle", "Endeavour", "Odyssey"],
        answer: 1,
        explanation: "Eagle fue el módulo lunar que llevó a Neil Armstrong y Buzz Aldrin hasta la superficie de la Luna."
      },
      {
        question: "¿Qué misión llevó a las primeras personas a la Luna?",
        options: ["Apolo 8", "Apolo 10", "Apolo 11", "Apolo 13"],
        answer: 2,
        explanation: "Apolo 11 alunizó el 20 de julio de 1969; Armstrong y Aldrin caminaron sobre la Luna."
      },
      {
        question: "¿Qué telescopio espacial fue lanzado en 1990 y observa sobre todo en luz visible?",
        options: ["Kepler", "Hubble", "Chandra", "Spitzer"],
        answer: 1,
        explanation: "El telescopio espacial Hubble fue desplegado en 1990 y ha transformado nuestra visión del universo."
      },
      {
        question: "¿Qué rover de la NASA aterrizó en Marte en 2021?",
        options: ["Curiosity", "Opportunity", "Perseverance", "Sojourner"],
        answer: 2,
        explanation: "Perseverance aterrizó en el cráter Jezero en 2021 para buscar indicios de vida microbiana antigua."
      },
      {
        question: "¿Qué planeta explora la misión Juno desde 2016?",
        options: ["Saturno", "Júpiter", "Urano", "Neptuno"],
        answer: 1,
        explanation: "Juno estudia la atmósfera, el campo magnético y el interior de Júpiter desde una órbita polar."
      },
      {
        question: "¿Cuál fue la primera estación espacial habitada de forma continua?",
        options: ["Skylab", "Mir", "Estación Espacial Internacional", "Salyut 1"],
        answer: 1,
        explanation: "La estación soviética Mir, puesta en órbita en 1986, fue habitada de forma continua desde 1989."
      },
      {
        question: "¿Qué planeta enano visitó la sonda New Horizons en 2015?",
        options: ["Ceres", "Eris", "Plutón", "Haumea"],
        answer: 2,
        explanation: "New Horizons realizó el primer sobrevuelo cercano de Plutón en julio de 2015."
      },
      {
        question: "¿Qué país lanzó la primera misión que alunizó en la cara oculta de la Luna?",
        options: ["India", "China", "Japón", "Estados Unidos"],
        answer: 1,
        explanation: "La misión china Chang'e 4 aterrizó en la cara oculta lunar en enero de 2019."
      }
    ];

    const letters = ["A", "B", "C", "D"];
    let currentQuestion = 0;
    let score = 0;
    let answered = false;
    let gameQuestions = [];
    let previousQuestionOrder = null;

    const count = document.getElementById("question-count");
    const scoreDisplay = document.getElementById("score");
    const progressTrack = document.querySelector(".progress-track");
    const progressFill = document.getElementById("progress-fill");
    const title = document.getElementById("question-title");
    const answers = document.getElementById("answers");
    const feedback = document.getElementById("feedback");
    const nextButton = document.getElementById("next-button");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const footer = document.getElementById("footer-note");

    function shuffle(items) {
      const shuffled = [...items];
      for (let index = shuffled.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [shuffled[index], shuffled[randomIndex]] = [shuffled[randomIndex], shuffled[index]];
      }
      return shuffled;
    }

    function startNewGame() {
      const questionOrder = shuffle(questions.map((_, index) => index));
      if (previousQuestionOrder
        && questionOrder.every((questionIndex, index) => questionIndex === previousQuestionOrder[index])) {
        [questionOrder[0], questionOrder[1]] = [questionOrder[1], questionOrder[0]];
      }
      previousQuestionOrder = questionOrder;
      gameQuestions = questionOrder.map((questionIndex) => {
        const question = questions[questionIndex];
        const options = shuffle(question.options.map((option, index) => ({ option, index })));
        return {
          ...question,
          options: options.map(({ option }) => option),
          answer: options.findIndex(({ index }) => index === question.answer)
        };
      });
    }

    function renderQuestion() {
      const item = gameQuestions[currentQuestion];
      answered = false;
      count.textContent = `Pregunta ${currentQuestion + 1} de ${gameQuestions.length}`;
      progressFill.style.width = `${(currentQuestion / gameQuestions.length) * 100}%`;
      progressTrack.setAttribute("aria-valuenow", String(currentQuestion));
      title.textContent = item.question;
      feedback.textContent = "";
      feedback.className = "feedback";
      nextButton.classList.add("hidden");
      nextButton.innerHTML = currentQuestion === questions.length - 1
        ? 'Ver resultado <span aria-hidden="true">→</span>'
        : 'Siguiente <span aria-hidden="true">→</span>';

      answers.replaceChildren(...item.options.map((option, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.setAttribute("aria-pressed", "false");
        button.innerHTML = `<span class="answer-letter" aria-hidden="true">${letters[index]}</span><span></span>`;
        button.lastElementChild.textContent = option;
        button.addEventListener("click", () => chooseAnswer(index));
        return button;
      }));
    }

    function chooseAnswer(selected) {
      if (answered) return;
      answered = true;
      const item = gameQuestions[currentQuestion];
      const buttons = answers.querySelectorAll(".answer");
      const isCorrect = selected === item.answer;

      buttons.forEach((button, index) => {
        button.disabled = true;
        button.setAttribute("aria-pressed", String(index === selected));
        if (index === selected) button.classList.add("selected");
        if (index === item.answer) button.classList.add("correct");
      });

      if (isCorrect) {
        score += 1;
        scoreDisplay.textContent = String(score);
      } else {
        buttons[selected].classList.add("incorrect");
      }

      progressFill.style.width = `${((currentQuestion + 1) / gameQuestions.length) * 100}%`;
      progressTrack.setAttribute("aria-valuenow", String(currentQuestion + 1));
      feedback.innerHTML = isCorrect
        ? `<strong>¡Correcto!</strong> ${item.explanation}`
        : `<strong>No era esa.</strong> ${item.explanation}`;
      feedback.classList.add("visible", isCorrect ? "good" : "bad");
      nextButton.classList.remove("hidden");
    }

    function showResult() {
      const percentage = score / gameQuestions.length;
      const reaction = percentage === 1
        ? ["🚀", "¡Dominio estelar!", "Has acertado todas. La exploración espacial no tiene secretos para ti."]
        : percentage >= .7
          ? ["🌟", "¡Gran viaje!", "Tienes una órbita excelente. Ya sabes un montón sobre la aventura espacial."]
          : percentage >= .4
            ? ["🪐", "¡Buen comienzo!", "Cada misión enseña algo nuevo. Sigue explorando: el cosmos es enorme."]
            : ["🌙", "¡A seguir explorando!", "Todo gran viaje empieza con curiosidad. ¡Prueba otra vez y alcanza nuevas estrellas!"];

      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");
      resultScreen.innerHTML = `
        <div class="result-emoji" aria-hidden="true">${reaction[0]}</div>
        <p class="eyebrow">Misión completada</p>
        <h1>${reaction[1]}</h1>
        <p class="result-copy">${reaction[2]}</p>
        <p class="result-score">Tu puntuación: <strong>${score}</strong> / ${gameQuestions.length}</p>
        <button class="primary" id="restart-button" type="button">Jugar de nuevo <span aria-hidden="true">↻</span></button>
      `;
      footer.textContent = "Gracias por viajar con Órbita";
      document.getElementById("restart-button").addEventListener("click", restart);
      document.getElementById("restart-button").focus();
    }

    function restart() {
      currentQuestion = 0;
      score = 0;
      scoreDisplay.textContent = "0";
      startNewGame();
      quizScreen.classList.remove("hidden");
      resultScreen.classList.add("hidden");
      footer.textContent = "10 preguntas · Una pequeña aventura por el cosmos";
      renderQuestion();
      title.focus();
    }

    nextButton.addEventListener("click", () => {
      if (!answered) return;
      if (currentQuestion === gameQuestions.length - 1) {
        showResult();
        return;
      }
      currentQuestion += 1;
      renderQuestion();
      title.focus();
    });

    startNewGame();
    renderQuestion();
  </script>
</body>
</html>
